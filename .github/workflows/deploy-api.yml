name: Deploy API

# Publishes the API to Azure App Service (Free F1). Skipped until the Azure settings below exist.
#   Repository variable : AZURE_API_APP_NAME           (the App Service name)
#   Repository secret   : AZURE_API_PUBLISH_PROFILE    (App Service > Get publish profile)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_API_APP_NAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/Api/MowTrackr.Api.csproj --configuration Release --output ./publish/api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ./publish/api