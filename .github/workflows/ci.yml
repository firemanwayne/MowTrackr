name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MowTrackr.slnx

      - name: Build
        run: dotnet build MowTrackr.slnx --configuration Release --no-restore

      # Tests are deferred until the app is further along; add a dotnet test step here once test projects exist.
