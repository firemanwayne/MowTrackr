name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MowTrackr.slnx

      - name: Build
        run: dotnet build MowTrackr.slnx --configuration Release --no-restore

      - name: Validate Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for env in dev prod; do
            az bicep build-params --file "infra/parameters/$env.bicepparam" --stdout > /dev/null
          done

      - name: Test
        run: dotnet test MowTrackr.slnx --configuration Release --no-build
