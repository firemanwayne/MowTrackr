name: Deploy

# Trunk-based: main is the only long-lived branch. Feature, fix and chore branches merge into main by pull request.
#   merge to main    -> deploys dev (dev.mowtrackr.com), then waits for approval to deploy prod
#   approval         -> the "prod-approval" environment lists who may approve; approve (or reject) the run in the Actions tab
#   manual run       -> dev, or prod (also behind the approval, and only from main), optionally as a what-if only
# Each environment is provisioned and published by deploy-environment.yml.
# Sign-in to Azure uses OpenID Connect (no stored Azure credentials). Run infra/bootstrap.ps1 once to set it up;
# until the AZURE_* variables exist the deploy jobs are skipped, and CI still runs on every push.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      what_if:
        description: 'Run a what-if analysis only (no deployment)'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    name: Dev
    if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      what_if: ${{ inputs.what_if == true }}
    secrets: inherit

  approve-prod:
    name: Approve prod
    needs: dev
    if: ${{ !cancelled() && (needs.dev.result == 'success' || needs.dev.result == 'skipped') && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.environment == 'prod' && inputs.what_if != true)) }}
    runs-on: ubuntu-latest
    # Required reviewers are configured on this environment, so the job waits here until someone approves.
    environment: prod-approval
    steps:
      # An approval can arrive long after the run started. Never deploy an older commit than what is on main now.
      - name: Require the latest commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "::error::A newer commit is on main ($latest). Approve the run for that commit instead of this one."
            exit 1
          fi

  prod:
    name: Prod
    needs: approve-prod
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      what_if: false
    secrets: inherit

  prod-what-if:
    name: Prod what-if
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && inputs.what_if == true && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      what_if: true
    secrets: inherit
